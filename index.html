<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title>AR.js OBJ Model</title>
    <!-- A-Frame の読み込み -->
    <script src="https://aframe.io/releases/1.3.0/aframe.min.js"></script>
    <!-- AR.js の読み込み -->
    <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>
    <script src="https://raw.githack.com/fcor/arjs-gestures/master/gesture-detector.js"></script>
    <script>
      // 1本指スワイプで平行移動（Pan）を行うカスタムコンポーネント
      AFRAME.registerComponent("gesture-handler", {
        schema: {
          enabled: { default: true },
          translationFactor: { default: 1 }, // 移動速度の調整用プロパティ
          minScale: { default: 0.3 },
          maxScale: { default: 8 },
        },
      
        init: function () {
          this.handleScale = this.handleScale.bind(this);
          this.handleTranslation = this.handleTranslation.bind(this);
      
          this.isVisible = false;
          this.initialScale = this.el.object3D.scale.clone();
          this.scaleFactor = 1;
      
          this.el.sceneEl.addEventListener("markerFound", (e) => {
            this.isVisible = true;
          });
      
          this.el.sceneEl.addEventListener("markerLost", (e) => {
            this.isVisible = false;
          });
        },
      
        update: function () {
          if (this.data.enabled) {
            this.el.sceneEl.addEventListener("onefingermove", this.handleTranslation);
            this.el.sceneEl.addEventListener("twofingermove", this.handleScale);
          } else {
            this.el.sceneEl.removeEventListener("onefingermove", this.handleTranslation);
            this.el.sceneEl.removeEventListener("twofingermove", this.handleScale);
          }
        },
      
        remove: function () {
          this.el.sceneEl.removeEventListener("onefingermove", this.handleTranslation);
          this.el.sceneEl.removeEventListener("twofingermove", this.handleScale);
        },
        
        handleTranslation: function (event) {
          if (this.isVisible) {
            // 1本指スワイプの移動量に応じてオブジェクトの座標 (position) を変更
            this.el.object3D.position.x +=
              event.detail.positionChange.x * this.data.translationFactor;
            
            this.el.object3D.position.z +=
              event.detail.positionChange.y * this.data.translationFactor;
          }
        },
      
        handleScale: function (event) {
          if (this.isVisible) {
            this.scaleFactor *=
              1 + event.detail.spreadChange / event.detail.startSpread;
      
            this.scaleFactor = Math.min(
              Math.max(this.scaleFactor, this.data.minScale),
              this.data.maxScale
            );
      
            this.el.object3D.scale.x = this.scaleFactor * this.initialScale.x;
            this.el.object3D.scale.y = this.scaleFactor * this.initialScale.y;
            this.el.object3D.scale.z = this.scaleFactor * this.initialScale.z;
          }
        },
      });
    </script>
    <style>
      div#ui {
          position: fixed;
          right: 0;
          z-index: 1;
          display: flex;
          align-items: center;
          height: 100%;
      }
      div#ui > input[type="range"] {
          height: 50vh;
          writing-mode: vertical-lr;
          padding: 2vh;
      }
    </style>
  </head>
  <body style="margin: 0; overflow: hidden;">
    <div id="ui">
      <input id="depth" type="range" min="0" max="0.2" value="0" step="0.001">
    </div>
    <!-- AR用のシーン設定 -->
    <a-scene embedded arjs="sourceType: webcam; debugUIEnabled: false;" gesture-detector>
      
      <!-- 1. モデルとマテリアルの事前読み込み -->
      <a-assets>
        <a-asset-item id="my-obj" src="./obj/dem.obj"></a-asset-item>
        <a-asset-item id="my-mtl" src="./obj/dem.mtl"></a-asset-item>
      </a-assets>

      <!-- 2. マーカーの設定 -->
      <a-marker preset="custom" type='pattern' url="pattern-marker.patt">
        <a-entity
            class="cantap"
            gesture-handler="minScale: 0.25; maxScale: 8;">
          <a-entity
            obj-model="obj: #my-obj; mtl: #my-mtl"
            scale="0.0065 0.0065 0.0065" 
            position="0.5 0 -0.5"
            rotation="0 0 0">
          </a-entity>
          <a-box
            id="water"
            material="color: #08f; transparent: true; opacity: 0.5"
            position="0 0 0"
            scale="1 0 1">
          </a-box>
        </a-entity>
      </a-marker>

      <!-- カメラの追加 -->
      <a-entity camera></a-entity>

    </a-scene>
    <script>
      const depthElem = document.querySelector('#depth');
      const waterElem = document.querySelector('#water');
      depthElem.addEventListener('input', (e) => {
        let value = e.target.value;
        waterElem.object3D.position.y = value / 2;
        waterElem.object3D.scale.y = value;
      });
    </script>
  </body>
</html>
