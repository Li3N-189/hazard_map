<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title>AR.js OBJ Model</title>
    <!-- A-Frame の読み込み -->
    <script src="https://aframe.io/releases/1.3.0/aframe.min.js"></script>
    <!-- AR.js の読み込み -->
    <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>
    <script>
      // ピンチ操作で拡大縮小するA-Frameコンポーネント
      AFRAME.registerComponent('pinch-scale', {
        init: function () {
          this.elRef = this.el;
          this.initialDistance = null;
          this.initialScale = this.elRef.getAttribute('scale') || {x: 1, y: 1, z: 1};
    
          window.addEventListener('touchstart', (e) => {
            if (e.touches.length === 2) {
              this.initialDistance = this.getDistance(e.touches[0], e.touches[1]);
              this.initialScale = { ...this.elRef.getAttribute('scale') };
            }
          });
    
          window.addEventListener('touchmove', (e) => {
            if (e.touches.length === 2 && this.initialDistance) {
              const currentDistance = this.getDistance(e.touches[0], e.touches[1]);
              const factor = currentDistance / this.initialDistance;
    
              // 拡大縮小の反映 (Min/Max制限はお好みで)
              this.elRef.setAttribute('scale', {
                x: Math.max(0.1, Math.min(10, this.initialScale.x * factor)),
                y: Math.max(0.1, Math.min(10, this.initialScale.y * factor)),
                z: Math.max(0.1, Math.min(10, this.initialScale.z * factor))
              });
            }
          });
    
          window.addEventListener('touchend', (e) => {
            if (e.touches.length < 2) {
              this.initialDistance = null;
            }
          });
        },
        getDistance: function (touch1, touch2) {
          const dx = touch1.pageX - touch2.pageX;
          const dy = touch1.pageY - touch2.pageY;
          return Math.sqrt(dx * dx + dy * dy);
        }
      });
    </script>
  </head>
  <body style="margin: 0; overflow: hidden;">
    
    <!-- AR用のシーン設定 -->
    <a-scene embedded arjs="sourceType: webcam; debugUIEnabled: false;">
      
      <!-- 1. モデルとマテリアルの事前読み込み -->
      <a-assets>
        <!-- ご自身のファイルパスに書き換えてください -->
        <a-asset-item id="my-obj" src="./obj/dem.obj"></a-asset-item>
        <a-asset-item id="my-mtl" src="./obj/dem.mtl"></a-asset-item>
      </a-assets>

      <!-- 2. マーカーの設定 -->
      <a-marker preset="custom" type='pattern' url="pattern-marker.patt">
        
        <!-- 3. OBJモデルの配置 -->
        <a-entity 
          pinch-scale
          obj-model="obj: #my-obj; mtl: #my-mtl"
          scale="0.0065 0.0065 0.0065" 
          position="0.5 0 -0.5" 
          rotation="0 0 0">
        </a-entity>
        <a-box material="color: #08f; transparent: true; opacity: 0.5;" position="0 0.5 0" scale="1 1 1"></a-box>
        
      </a-marker>

      <!-- カメラの追加 -->
      <a-entity camera></a-entity>

    </a-scene>
  </body>
</html>
