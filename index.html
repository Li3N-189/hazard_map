<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title>AR.js OBJ Model</title>
    <!-- A-Frame の読み込み -->
    <script src="https://aframe.io/releases/1.3.0/aframe.min.js"></script>
    <!-- AR.js の読み込み -->
    <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>
  </head>
  <body style="margin: 0; overflow: hidden;">
    
    <!-- AR用のシーン設定 -->
    <a-scene embedded arjs="sourceType: webcam; debugUIEnabled: false;">
      
      <!-- 1. モデルとマテリアルの事前読み込み -->
      <a-assets>
        <!-- ご自身のファイルパスに書き換えてください -->
        <a-asset-item id="my-obj" src="./obj/dem.obj"></a-asset-item>
        <a-asset-item id="my-mtl" src="./obj/dem.mtl"></a-asset-item>
      </a-assets>

      <!-- 2. マーカーの設定 -->
      <a-marker preset="custom" type='pattern' url="pattern-marker.patt">
        
        <!-- 3. OBJモデルの配置 -->
        <a-entity 
          obj-model="obj: #my-obj; mtl: #my-mtl"
          scale="0.0065 0.0065 0.0065" 
          position="0.5 0 -0.5" 
          rotation="0 0 0">
        </a-entity>
        <a-box material="color: #08f; transparent: true; opacity: 0.5;" position="0 0.5 0" scale="1 1 1"></a-box>
        
      </a-marker>

      <!-- カメラの追加 -->
      <a-entity camera></a-entity>

    </a-scene>
  </body>
</html>
