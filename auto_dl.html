<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title>AR.js GSI 3D Terrain with Vector Annotations</title>
    <!-- A-Frame の読み込み -->
    <script src="https://aframe.io/releases/1.3.0/aframe.min.js"></script>
    <!-- AR.js の読み込み -->
    <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>
    <script src="https://raw.githack.com/fcor/arjs-gestures/master/gesture-detector.js"></script>
    <!-- ベクトルタイル (PBF/MVT) パース用ライブラリ -->
    <script src="https://unpkg.com/pbf@3.2.1/dist/pbf.js"></script>
    <script src="https://unpkg.com/@mapbox/vector-tile@1.3.1/dist/vector-tile.js"></script>

    <script>
      // 緯度経度・ズームレベルからタイル座標(x, y)の正確な浮動小数点値を算出
      function latLonToTileExact(lat, lon, zoom) {
        const n = Math.pow(2, zoom);
        const rad = lat * Math.PI / 180;
        const x = (lon + 180) / 360 * n;
        const y = (1 - Math.log(Math.tan(rad) + 1 / Math.cos(rad)) / Math.PI) / 2 * n;
        return { x, y };
      }

      // メルカトルピクセル/タイル内ローカル座標から緯度経度への逆変換
      function tileFractionToLatLon(tileX, tileY, fractionX, fractionY, zoom) {
        const n = Math.pow(2, zoom);
        const lon = ((tileX + fractionX) / n) * 360 - 180;
        const latRad = Math.atan(Math.sinh(Math.PI * (1 - 2 * (tileY + fractionY) / n)));
        const lat = latRad * 180 / Math.PI;
        return { lat, lon };
      }

      // 国土地理院 DEM PNGのピクセル(RGB)から標高(m)を算出
      function getElevation(imgData, x, y) {
        const clampedX = Math.max(0, Math.min(imgData.width - 1, Math.floor(x)));
        const clampedY = Math.max(0, Math.min(imgData.height - 1, Math.floor(y)));
        const idx = (clampedY * imgData.width + clampedX) * 4;
        const r = imgData.data[idx];
        const g = imgData.data[idx + 1];
        const b = imgData.data[idx + 2];

        const u = r * 65536 + g * 256 + b;
        if (u === 8388608) return 0;
        return (u < 8388608) ? (u * 0.01) : ((u - 16777216) * 0.01);
      }

      // 標高タイル画像(PNG)の非同期取得
      function loadDEMTile(url) {
        return new Promise((resolve, reject) => {
          const img = new Image();
          img.crossOrigin = 'Anonymous';
          img.onload = () => {
            const canvas = document.createElement('canvas');
            canvas.width = img.width;
            canvas.height = img.height;
            const ctx = canvas.getContext('2d');
            ctx.drawImage(img, 0, 0);
            resolve(ctx.getImageData(0, 0, img.width, img.height));
          };
          img.onerror = () => reject(new Error('DEMタイルの取得に失敗しました'));
          img.src = url;
        });
      }

      // 高解像度テクスチャ（ズーム+1の4枚サブタイル）を1枚のCanvasテクスチャに合成
      async function loadCompositeTexture(baseTileX, baseTileY, zoom, tileType) {
        const subZoom = zoom + 1;
        const startX = baseTileX * 2;
        const startY = baseTileY * 2;
        const canvas = document.createElement('canvas');
        canvas.width = 512;
        canvas.height = 512;
        const ctx = canvas.getContext('2d');

        const promises = [];
        for (let dy = 0; dy < 2; dy++) {
          for (let dx = 0; dx < 2; dx++) {
            const tx = startX + dx;
            const ty = startY + dy;
            const subUrl = `https://cyberjapandata.gsi.go.jp/xyz/${tileType}/${subZoom}/${tx}/${ty}.png`;
            const p = new Promise((resolve) => {
              const img = new Image();
              img.crossOrigin = 'Anonymous';
              img.onload = () => {
                ctx.drawImage(img, dx * 256, dy * 256, 256, 256);
                resolve();
              };
              img.onerror = () => resolve();
              img.src = subUrl;
            });
            promises.push(p);
          }
        }
        await Promise.all(promises);
        return new THREE.CanvasTexture(canvas);
      }

      // 地理院地図Vectorタイル(pbf)から注釈フィーチャを非同期抽出
      async function loadGsiVectorLabels(zoom, tileX, tileY) {
        // 地理院ベクトルタイル実験室 (最適化ベクトルタイル)
        const vectorUrl = `https://cyberjapandata.gsi.go.jp/xyz/experimental_bvmap/${zoom}/${tileX}/${tileY}.pbf`;
        try {
          const res = await fetch(vectorUrl);
          if (!res.ok) return [];
          const buffer = await res.arrayBuffer();
          const pbf = new Pbf(new Uint8Array(buffer));
          const tile = new vector_tile.VectorTile(pbf);

          const labels = [];
          // 主要な注釈・シンボルレイヤを走査
          const targetLayers = ['label', 'symbol'];
          targetLayers.forEach((layerName) => {
            const layer = tile.layers[layerName];
            if (!layer) return;

            for (let i = 0; i < layer.length; i++) {
              const feat = layer.feature(i);
              const props = feat.properties;
              const text = props.name || props.knj || props.text;
              if (!text) continue;

              // フィーチャ形状からタイル内割合(0.0〜1.0)を算出
              const geom = feat.loadGeometry();
              if (geom && geom[0] && geom[0][0]) {
                const pt = geom[0][0];
                const fx = pt.x / layer.extent;
                const fy = pt.y / layer.extent;
                labels.push({
                  text: text,
                  fractionX: fx,
                  fractionY: fy,
                  type: props.class || 'general'
                });
              }
            }
          });
          return labels;
        } catch (e) {
          console.warn('Vectorタイルの取得・パースをスキップ:', e);
          return [];
        }
      }

      // ビルボード型3Dテキストスプライトの生成
      function createTextSprite(text, fontSize = 28, bgColor = 'rgba(0, 0, 0, 0.75)', textColor = '#ffffff') {
        const canvas = document.createElement('canvas');
        const ctx = canvas.getContext('2d');
        ctx.font = `bold ${fontSize}px sans-serif`;
        const textWidth = ctx.measureText(text).width;
        
        canvas.width = THREE.MathUtils.ceilPowerOfTwo(textWidth + 30);
        canvas.height = THREE.MathUtils.ceilPowerOfTwo(fontSize + 24);

        ctx.font = `bold ${fontSize}px sans-serif`;
        ctx.fillStyle = bgColor;
        ctx.roundRect ? ctx.roundRect(4, 4, canvas.width - 8, canvas.height - 8, 8) : ctx.fillRect(4, 4, canvas.width - 8, canvas.height - 8);
        ctx.fill();

        ctx.strokeStyle = '#ffffff';
        ctx.lineWidth = 2;
        ctx.stroke();

        ctx.fillStyle = textColor;
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText(text, canvas.width / 2, canvas.height / 2);

        const texture = new THREE.CanvasTexture(canvas);
        const spriteMaterial = new THREE.SpriteMaterial({
          map: texture,
          depthTest: false,
          depthWrite: false
        });
        const sprite = new THREE.Sprite(spriteMaterial);
        
        // スケール調整（AR空間内で適切な大きさになるよう正規化）
        const aspect = canvas.width / canvas.height;
        const baseHeight = 0.04;
        sprite.scale.set(baseHeight * aspect, baseHeight, 1.0);
        return sprite;
      }

      // 国土地理院 地形3Dメッシュ & ベクトル注釈統合コンポーネント
      AFRAME.registerComponent('gsi-terrain', {
        schema: {
          lat: { type: 'number', default: 35.3606 },
          lon: { type: 'number', default: 138.7274 },
          zoom: { type: 'int', default: 12 },
          heightScale: { type: 'number', default: 1.0 },
          tileType: { type: 'string', default: 'seamlessphoto' } // 視認性向上のためデフォルトを航空写真に変更
        },

        init: function () {
          this.loadTerrain();
        },

        update: function (oldData) {
          if (oldData.lat !== this.data.lat || oldData.lon !== this.data.lon || 
              oldData.zoom !== this.data.zoom || oldData.heightScale !== this.data.heightScale || 
              oldData.tileType !== this.data.tileType) {
            this.loadTerrain();
          }
        },

        loadTerrain: async function () {
          const { lat, lon, zoom, heightScale, tileType } = this.data;

          const exactTile = latLonToTileExact(lat, lon, zoom);
          const tileX = Math.floor(exactTile.x);
          const tileY = Math.floor(exactTile.y);
          const fractionX = exactTile.x - tileX;
          const fractionY = exactTile.y - tileY;

          const R = 6378137;
          const latRad = lat * Math.PI / 180;
          const tileSizeMeters = (2 * Math.PI * R * Math.cos(latRad)) / Math.pow(2, zoom);
          const targetSize = 1.0;

          const demUrl = `https://cyberjapandata.gsi.go.jp/xyz/dem_png/${zoom}/${tileX}/${tileY}.png`;

          try {
            // DEM、高解像度合成テクスチャ、およびベクトル注釈を並列ロード
            const [demData, texture, vectorLabels] = await Promise.all([
              loadDEMTile(demUrl),
              loadCompositeTexture(tileX, tileY, zoom, tileType),
              loadGsiVectorLabels(zoom, tileX, tileY)
            ]);

            // --- 地形メッシュの生成 ---
            const segments = 255;
            const geometry = new THREE.PlaneGeometry(targetSize, targetSize, segments, segments);
            const posAttr = geometry.attributes.position;

            for (let y = 0; y <= segments; y++) {
              for (let x = 0; x <= segments; x++) {
                const index = y * (segments + 1) + x;
                const h = getElevation(demData, x, y);
                const hScale = (h / tileSizeMeters) * targetSize * heightScale;
                posAttr.setZ(index, hScale);
              }
            }
            geometry.computeVertexNormals();

            const material = new THREE.MeshStandardMaterial({
              map: texture,
              roughness: 0.8,
              metalness: 0.1,
              side: THREE.DoubleSide
            });

            const mesh = new THREE.Mesh(geometry, material);
            mesh.rotation.x = -Math.PI / 2;

            // --- ターゲットピン（マーカー）の生成 ---
            const px = Math.min(Math.floor(fractionX * 256), 255);
            const py = Math.min(Math.floor(fractionY * 256), 255);
            const exactH = getElevation(demData, px, py);
            const exactHScale = (exactH / tileSizeMeters) * targetSize * heightScale;

            const pinX = (fractionX - 0.5) * targetSize;
            const pinZ = (fractionY - 0.5) * targetSize;
            const pinY = exactHScale;

            const pinGroup = new THREE.Group();
            const pinHeight = 0.15;
            const pinGeo = new THREE.ConeGeometry(0.02, pinHeight, 16);
            const pinMat = new THREE.MeshStandardMaterial({ color: 0xff2222 });
            const pinMesh = new THREE.Mesh(pinGeo, pinMat);
            pinMesh.rotation.x = Math.PI;
            pinMesh.position.set(0, pinHeight / 2, 0);
            pinGroup.add(pinMesh);

            // 指定地点のARラベル
            const targetLabel = createTextSprite("指定地点", 28, 'rgba(230, 20, 20, 0.9)');
            targetLabel.position.set(0, pinHeight + 0.05, 0);
            pinGroup.add(targetLabel);

            pinGroup.position.set(pinX, pinY, pinZ);

            // --- シーン構築 ---
            while (this.el.object3D.children.length > 0) {
              this.el.object3D.remove(this.el.object3D.children[0]);
            }
            this.el.object3D.add(mesh);
            this.el.object3D.add(pinGroup);

            // --- ベクトル注釈のARオブジェクト配置 ---
            const annotationsGroup = new THREE.Group();
            const maxLabels = 25; // パフォーマンスと視認性維持のため上限を設定
            let placed = 0;

            for (const item of vectorLabels) {
              if (placed >= maxLabels) break;
              // 画面端すぎるラベルは除外
              if (item.fractionX < 0.05 || item.fractionX > 0.95 || item.fractionY < 0.05 || item.fractionY > 0.95) continue;

              const lx = (item.fractionX - 0.5) * targetSize;
              const lz = (item.fractionY - 0.5) * targetSize;
              const elevPx = item.fractionX * 255;
              const elevPy = item.fractionY * 255;
              const lh = getElevation(demData, elevPx, elevPy);
              const ly = (lh / tileSizeMeters) * targetSize * heightScale;

              // 地形より少し浮かせた位置に配置
              const sprite = createTextSprite(item.text, 22, 'rgba(20, 30, 45, 0.8)');
              sprite.position.set(lx, ly + 0.035, lz);
              annotationsGroup.add(sprite);
              placed++;
            }
            this.el.object3D.add(annotationsGroup);

          } catch (err) {
            console.error('地形・注釈データの生成に失敗しました:', err);
          }
        },

        tick: function() {
          // ピン位置ナビゲーター（既存ロジックを保持）
          if (this.el.object3D.children.length >= 2) {
            let pinGroup = this.el.object3D.children[1];
            let scene = document.querySelector('a-scene');
            let markerEl = document.querySelector("a-marker");
            let navigator = document.querySelector('span#navigator');
            let shown = false;
            
            if (scene?.camera && scene?.canvas && markerEl?.object3D?.visible) {
              const rect = scene.canvas.getBoundingClientRect();
              let worldPos = new THREE.Vector3();
              pinGroup.getWorldPosition(worldPos);
              worldPos.project(scene.camera);

              let screenX = (worldPos.x + 1) * rect.width / 2 + rect.left;
              let screenY = (-worldPos.y + 1) * rect.height / 2 + rect.top;

              if (screenX < 0 || screenX > window.innerWidth || screenY < 0 || screenY > window.innerHeight) {
                const wrapper = document.querySelector('div#fixed-overlay');
                if (wrapper) {
                  if (!navigator) {
                    navigator = document.createElement('span');
                    navigator.id = 'navigator';
                    navigator.innerText = 'ピンの位置';
                    wrapper.appendChild(navigator);
                  }
                  navigator.className = '';
                  if (screenX < 0) navigator.classList.add('pointing-left');
                  if (screenX > window.innerWidth) navigator.classList.add('pointing-right');
                  if (screenY < 0) navigator.classList.add('pointing-up');
                  if (screenY > window.innerHeight) navigator.classList.add('pointing-down');
                  
                  const navRect = navigator.getBoundingClientRect();
                  screenX = Math.max(navRect.width / 2 + 10, Math.min(window.innerWidth - navRect.width / 2 - 10, screenX));
                  screenY = Math.max(navRect.height / 2 + 10, Math.min(window.innerHeight - navRect.height / 2 - 10, screenY));
                  
                  navigator.style.top = screenY + 'px';
                  navigator.style.left = screenX + 'px';
                  shown = true;
                }
              }
            }
            if (!shown && navigator) navigator.classList.add('invisible');
          }
        }
      });

      // ジェスチャー操作コンポーネント (ピンチイン/アウトおよびスワイプ)
      AFRAME.registerComponent("gesture-handler", {
        schema: { enabled: { default: true }, translationFactor: { default: 1 }, minScale: { default: 0.3 }, maxScale: { default: 8 } },
        init: function () {
          this.handleScale = this.handleScale.bind(this);
          this.handleTranslation = this.handleTranslation.bind(this);
          this.isVisible = false;
          this.initialScale = this.el.object3D.scale.clone();
          this.scaleFactor = 1;
          this.el.sceneEl.addEventListener("markerFound", () => { this.isVisible = true; });
          this.el.sceneEl.addEventListener("markerLost", () => { this.isVisible = false; });
        },
        update: function () {
          if (this.data.enabled) {
            this.el.sceneEl.addEventListener("onefingermove", this.handleTranslation);
            this.el.sceneEl.addEventListener("twofingermove", this.handleScale);
          } else {
            this.el.sceneEl.removeEventListener("onefingermove", this.handleTranslation);
            this.el.sceneEl.removeEventListener("twofingermove", this.handleScale);
          }
        },
        remove: function () {
          this.el.sceneEl.removeEventListener("onefingermove", this.handleTranslation);
          this.el.sceneEl.removeEventListener("twofingermove", this.handleScale);
        },
        handleTranslation: function (event) {
          if (this.isVisible) {
            this.el.object3D.position.x += event.detail.positionChange.x * this.data.translationFactor;
            this.el.object3D.position.z += event.detail.positionChange.y * this.data.translationFactor;
          }
        },
        handleScale: function (event) {
          if (this.isVisible) {
            this.scaleFactor *= 1 + event.detail.spreadChange / event.detail.startSpread;
            this.scaleFactor = Math.min(Math.max(this.scaleFactor, this.data.minScale), this.data.maxScale);
            this.el.object3D.scale.x = this.scaleFactor * this.initialScale.x;
            this.el.object3D.scale.y = this.scaleFactor * this.initialScale.y;
            this.el.object3D.scale.z = this.scaleFactor * this.initialScale.z;
          }
        },
      });
    </script>
    <style>
      div#ui { position: fixed; right: 0; z-index: 10; display: flex; align-items: center; height: 100%; }
      div#ui > input[type="range"] { height: 50vh; writing-mode: vertical-rl; transform: rotate(180deg); padding: 2vh; }
      #navigator {
        position: fixed;
        display: inline-block;
        padding: 1.5vh 2vh;
        background-color: rgba(220, 20, 20, 0.85);
        color: white;
        font-size: 1.8vh;
        font-weight: bold;
        border-radius: 0.8vh;
        font-family: sans-serif;
        transform: translate(-50%, -50%);
        pointer-events: none;
        white-space: nowrap;
        box-shadow: 0 4px 10px rgba(0,0,0,0.3);
      }
      #navigator::after {
        font-size: 1vh;
        content: "▲";
        position: absolute;
      }
      #navigator.pointing-up::after { top: 10%; left: 50%; transform: translateX(-50%); }
      #navigator.pointing-right::after { top: 50%; right: 5%; transform: translateY(-50%) rotate(90deg); }
      #navigator.pointing-down::after { bottom: 10%; left: 50%; transform: translateX(-50%) rotate(180deg); }
      #navigator.pointing-left::after { top: 50%; left: 5%; transform: translateY(-50%) rotate(270deg); }
      #navigator.invisible { display: none; }
    </style>
  </head>
  <body style="margin: 0; overflow: hidden;">
    <div id="ui">
      <input id="depth" type="range" min="0" max="0.2" value="0" step="0.001">
    </div>

    <a-scene embedded arjs="sourceType: webcam; debugUIEnabled: false;" gesture-detector renderer="logarithmicDepthBuffer: true; antialias: true;">
      <a-light type="ambient" intensity="0.7"></a-light>
      <a-light type="directional" position="1 3 2" intensity="0.9"></a-light>

      <a-marker preset="custom" type='pattern' url="pattern-marker.patt">
        <a-entity class="cantap" gesture-handler="minScale: 0.25; maxScale: 8;">
          <a-entity id="terrain" gsi-terrain="lat: 35.3606; lon: 138.7274; zoom: 12;" position="0 0 0"></a-entity>
          <a-box id="water" material="color: #08f; transparent: true; opacity: 0.45; depthWrite: false" position="0 0 0" scale="1 0 1"></a-box>
        </a-entity>
      </a-marker>
      <a-entity id="camera" camera="near: 0.05; far: 30;"></a-entity>
    </a-scene>
    <div id="fixed-overlay"></div>

    <script>
      const urlParams = new URLSearchParams(window.location.search);
      const lat = parseFloat(urlParams.get('lat')) || 35.3606;
      const lon = parseFloat(urlParams.get('lon')) || 138.7274;
      const zoom = parseInt(urlParams.get('zoom')) || 12;
      const heightScale = parseFloat(urlParams.get('heightScale')) || 1.0;
      const tileType = urlParams.get('tileType') || 'seamlessphoto'; // 航空写真 または pale / std

      const terrainElem = document.querySelector('#terrain');
      terrainElem.setAttribute('gsi-terrain', `lat: ${lat}; lon: ${lon}; zoom: ${zoom}; heightScale: ${heightScale}; tileType: ${tileType};`);
      
      const depthElem = document.querySelector('#depth');
      const waterElem = document.querySelector('#water');
      depthElem.addEventListener('input', (e) => {
        let value = e.target.value;
        waterElem.object3D.position.y = value / 2;
        waterElem.object3D.scale.y = value;
      });
    </script>
  </body>
</html>
