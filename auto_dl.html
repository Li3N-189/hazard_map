<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>AR.js GSI 3D Terrain with Pin</title>
    <script src="https://aframe.io/releases/1.3.0/aframe.min.js"></script>
    <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>
    <script src="https://raw.githack.com/fcor/arjs-gestures/master/gesture-detector.js"></script>
    <script>
      // ===== 地理院タイル設定 =====
      const GSI_BASE = 'https://cyberjapandata.gsi.go.jp/xyz';
      const GSI_TILE_TYPES = {
        std:           { ext: 'png', maxZoom: 18 }, // 標準地図（注記あり）
        pale:          { ext: 'png', maxZoom: 18 }, // 淡色地図（注記あり）
        blank:         { ext: 'png', maxZoom: 14 }, // 白地図
        seamlessphoto: { ext: 'jpg', maxZoom: 18 }, // 全国最新写真（注記なし）
      };

      function latLonToTileExact(lat, lon, zoom) {
        const n = Math.pow(2, zoom);
        const rad = lat * Math.PI / 180;
        const x = (lon + 180) / 360 * n;
        const y = (1 - Math.log(Math.tan(rad) + 1 / Math.cos(rad)) / Math.PI) / 2 * n;
        return { x, y };
      }

      function getElevation(imgData, x, y) {
        const idx = (y * imgData.width + x) * 4;
        const u = imgData.data[idx] * 65536 + imgData.data[idx + 1] * 256 + imgData.data[idx + 2];
        if (u === 8388608) return 0;
        return (u < 8388608) ? (u * 0.01) : ((u - 16777216) * 0.01);
      }

      // 画像キャッシュ付きローダ（失敗時は null を返す）
      const imageCache = new Map();
      function loadImageCached(url) {
        if (imageCache.has(url)) return imageCache.get(url);
        const p = new Promise((resolve) => {
          const img = new Image();
          img.crossOrigin = 'anonymous';
          img.onload = () => resolve(img);
          img.onerror = () => resolve(null);
          img.src = url;
        });
        imageCache.set(url, p);
        return p;
      }

      async function loadDEMTile(url) {
        const img = await loadImageCached(url);
        if (!img) throw new Error('DEMタイルの取得に失敗しました');
        const canvas = document.createElement('canvas');
        canvas.width = img.width;
        canvas.height = img.height;
        const ctx = canvas.getContext('2d');
        ctx.drawImage(img, 0, 0);
        return ctx.getImageData(0, 0, img.width, img.height);
      }

      // 日本語ラベル用スプライト（A-Frame標準の<a-text>は日本語グリフ非対応のため Canvas で描画）
      function makeLabelSprite(text, opts = {}) {
        const color = opts.color || '#1a1a1a';
        const bg = opts.bg || 'rgba(255,255,255,0.88)';
        const border = opts.border || 'rgba(0,0,0,0.25)';
        const fontPx = 48, padX = 18, padY = 10;
        const font = `bold ${fontPx}px "Hiragino Sans", "Noto Sans JP", sans-serif`;

        const canvas = document.createElement('canvas');
        let ctx = canvas.getContext('2d');
        ctx.font = font;
        const w = Math.ceil(ctx.measureText(text).width) + padX * 2;
        const h = fontPx + padY * 2;
        canvas.width = w;
        canvas.height = h;
        ctx = canvas.getContext('2d');
        ctx.font = font;

        const r = h / 4;
        ctx.beginPath();
        ctx.moveTo(r, 0); ctx.lineTo(w - r, 0); ctx.quadraticCurveTo(w, 0, w, r);
        ctx.lineTo(w, h - r); ctx.quadraticCurveTo(w, h, w - r, h);
        ctx.lineTo(r, h); ctx.quadraticCurveTo(0, h, 0, h - r);
        ctx.lineTo(0, r); ctx.quadraticCurveTo(0, 0, r, 0);
        ctx.closePath();
        ctx.fillStyle = bg; ctx.fill();
        ctx.lineWidth = 3; ctx.strokeStyle = border; ctx.stroke();
        ctx.fillStyle = color;
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText(text, w / 2, h / 2 + 2);

        const tex = new THREE.CanvasTexture(canvas);
        tex.minFilter = THREE.LinearFilter;
        tex.generateMipmaps = false;
        const mat = new THREE.SpriteMaterial({ map: tex, transparent: true, depthTest: false, depthWrite: false });
        const sprite = new THREE.Sprite(mat);
        sprite.center.set(0.5, 0);          // 下端中央を基準点にする
        sprite.renderOrder = 1000;          // 地形より手前に描画
        sprite.userData.aspect = w / h;
        return sprite;
      }

      AFRAME.registerComponent('gsi-terrain', {
        schema: {
          lat: { type: 'number', default: 35.3606 },
          lon: { type: 'number', default: 138.7274 },
          zoom: { type: 'int', default: 12 },
          heightScale: { type: 'number', default: 1.0 },
          tileType: { type: 'string', default: 'seamlessphoto' }, // 注記を地図に焼き込まない種類を推奨
          autoTexZoom: { type: 'boolean', default: true },        // 見た目の大きさに応じてテクスチャ解像度を自動調整
          texExtraZoom: { type: 'int', default: 1 },              // autoTexZoom=false 時の追加ズーム段数
          maxExtraZoom: { type: 'int', default: 3 },              // 3 => 8x8タイル(2048px)。モバイルでは3以下推奨
          labelScreenSize: { type: 'number', default: 0.045 },    // ラベルの高さ（画面高さに対する比率）
          maxLabels: { type: 'int', default: 30 },
          pinLabel: { type: 'string', default: '目的地' },
          annoSource: { type: 'string', default: 'none' },        // 'gsi' で地理院の注記ベクトルタイル(試験公開)を取得
          annoZoom: { type: 'int', default: 15 }
        },

        init: function () {
          this.size = 1.0;
          this.labels = [];
          this.userAnnotations = [];
          this.labelGroup = new THREE.Group();
          this.terrainRequestId = 0;
          this.texRequestId = 0;
          this.currentExtra = -1;
          this.loadingExtra = null;
          this.lastZoomCheck = 0;
          this.lastDeclutter = 0;
          this.tmpV = new THREE.Vector3();
          this.tmpV2 = new THREE.Vector3();
          this.tmpS = new THREE.Vector3();
          this.markerEl = this.el.closest('a-marker');
          // 初回読み込みは update() で行う（二重読み込み防止）
        },

        update: function (oldData) {
          const d = this.data;
          if (d.lat !== oldData.lat || d.lon !== oldData.lon || d.zoom !== oldData.zoom ||
              d.heightScale !== oldData.heightScale || d.annoSource !== oldData.annoSource ||
              d.annoZoom !== oldData.annoZoom || d.pinLabel !== oldData.pinLabel) {
            this.loadTerrain();
          } else if (d.tileType !== oldData.tileType && this.terrainMesh) {
            this.currentExtra = -1;
            this.applyTexture(this.initialExtra());
          }
        },

        remove: function () { this.clearScene(); },

        initialExtra: function () {
          return this.data.autoTexZoom ? 1 : this.data.texExtraZoom;
        },

        // 外部からの注記追加API: [{ text, lat, lon, priority? }, ...]
        addAnnotations: function (list) {
          for (const a of list) {
            this.userAnnotations.push(a);
            if (this.demData) this.addLabel(a.text, a.lat, a.lon, { priority: a.priority ?? 1e6 });
          }
        },

        loadTerrain: async function () {
          const { lat, lon, zoom, heightScale } = this.data;
          const reqId = ++this.terrainRequestId;

          const exact = latLonToTileExact(lat, lon, zoom);
          const tileX = Math.floor(exact.x);
          const tileY = Math.floor(exact.y);
          const R = 6378137;
          const tileSizeMeters = (2 * Math.PI * R * Math.cos(lat * Math.PI / 180)) / Math.pow(2, zoom);

          let demData;
          try {
            demData = await loadDEMTile(`${GSI_BASE}/dem_png/${zoom}/${tileX}/${tileY}.png`);
          } catch (err) {
            console.error('地形データの取得に失敗しました:', err);
            return;
          }
          if (reqId !== this.terrainRequestId) return;

          this.clearScene();
          this.tileX = tileX;
          this.tileY = tileY;
          this.tileSizeMeters = tileSizeMeters;
          this.demData = demData;

          // --- 地形メッシュ ---
          const seg = demData.width - 1;
          const geometry = new THREE.PlaneGeometry(this.size, this.size, seg, seg);
          const posAttr = geometry.attributes.position;
          for (let y = 0; y <= seg; y++) {
            for (let x = 0; x <= seg; x++) {
              const h = getElevation(demData, x, y);
              posAttr.setZ(y * (seg + 1) + x, (h / tileSizeMeters) * this.size * heightScale);
            }
          }
          geometry.computeVertexNormals();

          const material = new THREE.MeshStandardMaterial({
            color: 0xffffff, roughness: 1.0, metalness: 0.0, side: THREE.DoubleSide
          });
          this.terrainMesh = new THREE.Mesh(geometry, material);
          this.terrainMesh.rotation.x = -Math.PI / 2;
          this.el.object3D.add(this.terrainMesh);

          // --- ピン ---
          const p = this.localFromLatLon(lat, lon);
          const pinHeight = 0.15;
          this.pinMesh = new THREE.Mesh(
            new THREE.ConeGeometry(0.02, pinHeight, 16),
            new THREE.MeshStandardMaterial({ color: 0xff0000 })
          );
          this.pinMesh.rotation.x = Math.PI;
          this.pinMesh.position.set(p.x, p.y + pinHeight / 2, p.z);
          this.el.object3D.add(this.pinMesh);

          // --- 注記 ---
          this.el.object3D.add(this.labelGroup);
          if (this.data.pinLabel) {
            this.addLabel(this.data.pinLabel, lat, lon, {
              priority: Infinity, offsetY: pinHeight,
              bg: 'rgba(220,0,0,0.9)', color: '#fff', border: 'rgba(255,255,255,0.8)'
            });
          }
          for (const a of this.userAnnotations) {
            this.addLabel(a.text, a.lat, a.lon, { priority: a.priority ?? 1e6 });
          }
          if (this.data.annoSource === 'gsi') this.loadGsiAnnotations(reqId);

          // --- テクスチャ ---
          this.currentExtra = -1;
          this.loadingExtra = null;
          this.applyTexture(this.initialExtra());
        },

        clearScene: function () {
          if (this.terrainMesh) {
            this.terrainMesh.geometry.dispose();
            if (this.terrainMesh.material.map) this.terrainMesh.material.map.dispose();
            this.terrainMesh.material.dispose();
            this.el.object3D.remove(this.terrainMesh);
            this.terrainMesh = null;
          }
          if (this.pinMesh) {
            this.pinMesh.geometry.dispose();
            this.pinMesh.material.dispose();
            this.el.object3D.remove(this.pinMesh);
            this.pinMesh = null;
          }
          for (const L of this.labels) {
            L.sprite.material.map.dispose();
            L.sprite.material.dispose();
            L.line.geometry.dispose();
            L.line.material.dispose();
            this.labelGroup.remove(L.sprite, L.line);
          }
          this.labels = [];
        },

        // 緯度経度 → 地形ローカル座標（タイル外なら null）
        localFromLatLon: function (lat, lon) {
          const e = latLonToTileExact(lat, lon, this.data.zoom);
          const fx = e.x - this.tileX, fy = e.y - this.tileY;
          if (fx < 0 || fx >= 1 || fy < 0 || fy >= 1) return null;
          const w = this.demData.width;
          const px = Math.min(Math.floor(fx * w), w - 1);
          const py = Math.min(Math.floor(fy * w), w - 1);
          const h = getElevation(this.demData, px, py);
          return new THREE.Vector3(
            (fx - 0.5) * this.size,
            (h / this.tileSizeMeters) * this.size * this.data.heightScale,
            (fy - 0.5) * this.size
          );
        },

        addLabel: function (text, lat, lon, opts = {}) {
          const anchor = this.localFromLatLon(lat, lon);
          if (!anchor) return false;
          anchor.y += opts.offsetY || 0;

          const sprite = makeLabelSprite(text, opts);
          const line = new THREE.Line(
            new THREE.BufferGeometry().setFromPoints([new THREE.Vector3(0, 0, 0), new THREE.Vector3(0, 1, 0)]),
            new THREE.LineBasicMaterial({ color: 0xffffff, transparent: true, opacity: 0.9, depthTest: false })
          );
          line.renderOrder = 999;
          line.position.copy(anchor);
          sprite.position.copy(anchor);
          this.labelGroup.add(line, sprite);
          this.labels.push({ text, sprite, line, anchor, priority: opts.priority ?? anchor.y });
          return true;
        },

        // 地理院 注記ベクトルタイル（試験公開）の読み込み
        loadGsiAnnotations: async function (reqId) {
          const { zoom, annoZoom } = this.data;
          const extra = Math.min(Math.max(annoZoom - zoom, 0), 3); // 最大 8x8 タイル
          const n = 1 << extra, z = zoom + extra;
          const jobs = [];
          for (let j = 0; j < n; j++) {
            for (let i = 0; i < n; i++) {
              const url = `${GSI_BASE}/experimental_anno/${z}/${this.tileX * n + i}/${this.tileY * n + j}.geojson`;
              jobs.push(fetch(url).then(r => (r.ok ? r.json() : null)).catch(() => null));
            }
          }
          const results = await Promise.all(jobs);
          if (reqId !== this.terrainRequestId) return;

          const seen = new Set();
          for (const gj of results) {
            if (!gj || !Array.isArray(gj.features)) continue;
            for (const f of gj.features) {
              if (seen.size >= 200) return;
              if (!f.geometry || f.geometry.type !== 'Point') continue;
              const p = f.properties || {};
              const text = p.knj || p.name || p.text;
              if (!text || seen.has(text)) continue;
              seen.add(text);
              const [lon, lat] = f.geometry.coordinates;
              this.addLabel(text, lat, lon, {});
            }
          }
        },

        // 指定段数だけ高ズームのタイルを結合してテクスチャを作り、差し替える
        applyTexture: async function (extra) {
          const { zoom, tileType, maxExtraZoom } = this.data;
          const info = GSI_TILE_TYPES[tileType] || GSI_TILE_TYPES.std;
          extra = Math.max(0, Math.min(extra, maxExtraZoom, info.maxZoom - zoom));

          if (extra === this.currentExtra) {   // 既に適用済み → 読み込み中の要求は破棄
            this.texRequestId++;
            this.loadingExtra = null;
            return;
          }
          if (extra === this.loadingExtra) return;

          this.loadingExtra = extra;
          const reqId = ++this.texRequestId;
          const tileX = this.tileX, tileY = this.tileY;
          const n = 1 << extra, tz = zoom + extra;

          const canvas = document.createElement('canvas');
          canvas.width = canvas.height = 256 * n;
          const ctx = canvas.getContext('2d');
          ctx.fillStyle = '#cfcfcf';
          ctx.fillRect(0, 0, canvas.width, canvas.height);

          const jobs = [];
          for (let j = 0; j < n; j++) {
            for (let i = 0; i < n; i++) {
              const url = `${GSI_BASE}/${tileType}/${tz}/${tileX * n + i}/${tileY * n + j}.${info.ext}`;
              jobs.push(loadImageCached(url).then(img => { if (img) ctx.drawImage(img, i * 256, j * 256, 256, 256); }));
            }
          }
          await Promise.all(jobs);
          if (reqId !== this.texRequestId || !this.terrainMesh) return;

          const tex = new THREE.CanvasTexture(canvas);
          const renderer = this.el.sceneEl.renderer;
          tex.anisotropy = renderer ? renderer.capabilities.getMaxAnisotropy() : 1; // 斜めから見た時のボケを軽減

          const mat = this.terrainMesh.material;
          if (mat.map) mat.map.dispose();
          mat.map = tex;
          mat.needsUpdate = true;
          this.currentExtra = extra;
          this.loadingExtra = null;
        },

        // 地形の画面上のサイズ(px)から最適なテクスチャズームを決める
        updateAutoTexZoom: function (cam) {
          const canvas = this.el.sceneEl.canvas;
          const h = this.size / 2;
          let minX = Infinity, maxX = -Infinity, minY = Infinity, maxY = -Infinity;
          for (const [x, z] of [[-h, -h], [h, -h], [h, h], [-h, h]]) {
            this.tmpV.set(x, 0, z);
            this.el.object3D.localToWorld(this.tmpV).project(cam);
            if (this.tmpV.z > 1) return; // カメラ背面
            minX = Math.min(minX, this.tmpV.x); maxX = Math.max(maxX, this.tmpV.x);
            minY = Math.min(minY, this.tmpV.y); maxY = Math.max(maxY, this.tmpV.y);
          }
          const dpr = window.devicePixelRatio || 1;
          const px = Math.max(
            (maxX - minX) * canvas.clientWidth * dpr / 2,
            (maxY - minY) * canvas.clientHeight * dpr / 2
          );
          // ズーム1段 = 解像度2倍。ヒステリシスを持たせて頻繁な切替を防ぐ
          const ideal = Math.log2(Math.max(px, 1) / 256);
          if (Math.abs(ideal - this.currentExtra) > 0.75) {
            this.applyTexture(Math.round(ideal));
          }
        },

        // ラベルを常に一定の画面サイズに保つ
        updateLabels: function (cam) {
          if (!this.labels.length) return;
          const p5 = cam.projectionMatrix.elements[5]; // = 1 / tan(fov/2)（AR.jsの投影行列にも対応）
          this.labelGroup.getWorldScale(this.tmpS);
          const parentScale = this.tmpS.x || 1;
          cam.getWorldPosition(this.tmpV2);

          for (const L of this.labels) {
            L.line.getWorldPosition(this.tmpV);
            const d = this.tmpV.distanceTo(this.tmpV2);
            const hLocal = (2 * d / p5) * this.data.labelScreenSize / parentScale;
            const lift = hLocal * 1.2;
            L.line.scale.set(1, lift, 1);
            L.sprite.position.set(L.anchor.x, L.anchor.y + lift, L.anchor.z);
            L.sprite.scale.set(hLocal * L.sprite.userData.aspect, hLocal, 1);
          }
        },

        // 画面上で重なるラベルを優先度の低い順に非表示にする
        declutter: function (cam) {
          const canvas = this.el.sceneEl.canvas;
          const W = canvas.clientWidth, H = canvas.clientHeight;
          const hPx = this.data.labelScreenSize * H;
          const placed = [];
          let count = 0;
          const sorted = this.labels.slice().sort((a, b) => b.priority - a.priority);

          for (const L of sorted) {
            L.sprite.getWorldPosition(this.tmpV).project(cam);
            let ok = this.tmpV.z < 1 && Math.abs(this.tmpV.x) <= 1.1 && Math.abs(this.tmpV.y) <= 1.1 &&
                     count < this.data.maxLabels;
            if (ok) {
              const cx = (this.tmpV.x + 1) / 2 * W;
              const by = (1 - this.tmpV.y) / 2 * H;
              const w = hPx * L.sprite.userData.aspect;
              const r = { l: cx - w / 2, r: cx + w / 2, t: by - hPx, b: by };
              ok = !placed.some(q => r.l < q.r && r.r > q.l && r.t < q.b && r.b > q.t);
              if (ok) { placed.push(r); count++; }
            }
            L.sprite.visible = L.line.visible = ok;
          }
        },

        // 画面外のピン位置を示すナビゲータ
        updateNavigator: function (scene, cam, markerVisible) {
          this.overlay = this.overlay || document.querySelector('#fixed-overlay');
          let shown = false;

          if (markerVisible && this.pinMesh && this.overlay) {
            const rect = scene.canvas.getBoundingClientRect();
            this.pinMesh.getWorldPosition(this.tmpV).project(cam);
            let sx = (this.tmpV.x + 1) * rect.width / 2 + rect.left;
            let sy = (-this.tmpV.y + 1) * rect.height / 2 + rect.top;
            const W = window.innerWidth, H = window.innerHeight;

            if (sx < 0 || sx > W || sy < 0 || sy > H) {
              if (!this.navEl) {
                this.navEl = document.createElement('span');
                this.navEl.id = 'navigator';
                this.overlay.appendChild(this.navEl);
              }
              const nav = this.navEl;
              nav.textContent = this.data.pinLabel || 'ピンの位置';
              nav.classList.remove('invisible', 'pointing-left', 'pointing-right', 'pointing-up', 'pointing-down');
              if (sx < 0) nav.classList.add('pointing-left');
              if (sx > W) nav.classList.add('pointing-right');
              if (sy < 0) nav.classList.add('pointing-up');
              if (sy > H) nav.classList.add('pointing-down');

              const nr = nav.getBoundingClientRect();
              sx = Math.max(nr.width / 2 + 10, Math.min(W - nr.width / 2 - 10, sx));
              sy = Math.max(nr.height / 2 + 10, Math.min(H - nr.height / 2 - 10, sy));
              nav.style.left = sx + 'px';
              nav.style.top = sy + 'px';
              shown = true;
            }
          }
          if (!shown && this.navEl) this.navEl.classList.add('invisible');
        },

        tick: function (t) {
          if (!this.terrainMesh) return;
          const scene = this.el.sceneEl, cam = scene.camera;
          if (!cam || !scene.canvas) return;
          const markerVisible = !this.markerEl || this.markerEl.object3D.visible;

          this.updateNavigator(scene, cam, markerVisible);
          if (!markerVisible) return;

          this.updateLabels(cam);
          if (t - this.lastDeclutter > 150) { this.lastDeclutter = t; this.declutter(cam); }
          if (this.data.autoTexZoom && t - this.lastZoomCheck > 500) {
            this.lastZoomCheck = t;
            this.updateAutoTexZoom(cam);
          }
        }
      });

      // 1本指スワイプで移動、2本指で拡大縮小（変更なし）
      AFRAME.registerComponent("gesture-handler", {
        schema: { enabled: { default: true }, translationFactor: { default: 1 }, minScale: { default: 0.3 }, maxScale: { default: 8 } },
        init: function () {
          this.handleScale = this.handleScale.bind(this);
          this.handleTranslation = this.handleTranslation.bind(this);
          this.isVisible = false;
          this.initialScale = this.el.object3D.scale.clone();
          this.scaleFactor = 1;
          this.el.sceneEl.addEventListener("markerFound", () => { this.isVisible = true; });
          this.el.sceneEl.addEventListener("markerLost", () => { this.isVisible = false; });
        },
        update: function () {
          if (this.data.enabled) {
            this.el.sceneEl.addEventListener("onefingermove", this.handleTranslation);
            this.el.sceneEl.addEventListener("twofingermove", this.handleScale);
          } else {
            this.el.sceneEl.removeEventListener("onefingermove", this.handleTranslation);
            this.el.sceneEl.removeEventListener("twofingermove", this.handleScale);
          }
        },
        remove: function () {
          this.el.sceneEl.removeEventListener("onefingermove", this.handleTranslation);
          this.el.sceneEl.removeEventListener("twofingermove", this.handleScale);
        },
        handleTranslation: function (event) {
          if (this.isVisible) {
            this.el.object3D.position.x += event.detail.positionChange.x * this.data.translationFactor;
            this.el.object3D.position.z += event.detail.positionChange.y * this.data.translationFactor;
          }
        },
        handleScale: function (event) {
          if (this.isVisible) {
            this.scaleFactor *= 1 + event.detail.spreadChange / event.detail.startSpread;
            this.scaleFactor = Math.min(Math.max(this.scaleFactor, this.data.minScale), this.data.maxScale);
            this.el.object3D.scale.x = this.scaleFactor * this.initialScale.x;
            this.el.object3D.scale.y = this.scaleFactor * this.initialScale.y;
            this.el.object3D.scale.z = this.scaleFactor * this.initialScale.z;
          }
        },
      });
    </script>
    <style>
      div#ui { position: fixed; right: 0; z-index: 1; display: flex; align-items: center; height: 100%; }
      div#ui > input[type="range"] { height: 50vh; writing-mode: vertical-rl; transform: rotate(180deg); padding: 2vh; }
      #fixed-overlay { position: fixed; inset: 0; z-index: 2; pointer-events: none; }
      #attribution {
        position: fixed; left: 4px; bottom: 4px; z-index: 3;
        font: 11px sans-serif; color: #fff; background: rgba(0,0,0,0.5); padding: 2px 6px; border-radius: 3px;
      }
      #navigator {
        position: fixed; display: inline-block; padding: 2.5vh;
        background-color: rgba(255, 0, 0, 0.8); color: white;
        font-size: 2vh; font-weight: bold; font-family: sans-serif;
        border-radius: 1vh; -webkit-border-radius: 1vh;
        transform: translate(-50%, -50%); pointer-events: none; white-space: nowrap;
      }
      #navigator::before {
        content: ""; background-image: url('img/pin.png'); display: inline-block;
        width: 2vh; height: 2vh; background-size: contain; background-repeat: no-repeat; background-position: center;
      }
      #navigator::after { font-size: 1vh; content: "▲"; position: absolute; translate: -50% -50%; }
      #navigator.pointing-up::after { top: 20%; left: 50%; }
      #navigator.pointing-right::after { top: 50%; left: 90%; transform: rotate(90deg); }
      #navigator.pointing-down::after { top: 80%; left: 50%; transform: rotate(180deg); }
      #navigator.pointing-left::after { top: 50%; left: 10%; transform: rotate(270deg); }
      #navigator.pointing-up.pointing-right::after { top: 20%; left: 90%; transform: rotate(45deg); }
      #navigator.pointing-down.pointing-right::after { top: 80%; left: 90%; transform: rotate(135deg); }
      #navigator.pointing-down.pointing-left::after { top: 80%; left: 10%; transform: rotate(225deg); }
      #navigator.pointing-up.pointing-left::after { top: 20%; left: 10%; transform: rotate(315deg); }
      #navigator.invisible { display: none; }
    </style>
  </head>
  <body style="margin: 0; overflow: hidden;">
    <div id="ui">
      <input id="depth" type="range" min="0" max="0.2" value="0" step="0.001">
    </div>

    <a-scene embedded arjs="sourceType: webcam; debugUIEnabled: false;" gesture-detector renderer="logarithmicDepthBuffer: true;">
      <a-light type="ambient" intensity="0.8"></a-light>
      <a-light type="directional" position="1 2 1" intensity="0.6"></a-light>

      <a-marker preset="custom" type="pattern" url="pattern-marker.patt">
        <a-entity class="cantap" gesture-handler="minScale: 0.25; maxScale: 8;">
          <a-entity id="terrain" gsi-terrain position="0 0 0"></a-entity>
          <a-box id="water" material="color: #08f; transparent: true; opacity: 0.5; depthWrite: false" position="0 0 0" scale="1 0 1"></a-box>
        </a-entity>
      </a-marker>
      <a-entity id="camera" camera="near: 0.05; far: 20;"></a-entity>
    </a-scene>
    <div id="fixed-overlay"></div>
    <div id="attribution">出典：地理院タイル</div>

    <script>
      const q = new URLSearchParams(window.location.search);
      const terrainElem = document.querySelector('#terrain');

      // オブジェクト形式で設定（文字列形式より安全）
      terrainElem.setAttribute('gsi-terrain', {
        lat: parseFloat(q.get('lat')) || 35.3606,
        lon: parseFloat(q.get('lon')) || 138.7274,
        zoom: parseInt(q.get('zoom')) || 12,
        heightScale: parseFloat(q.get('heightScale')) || 1.0,
        tileType: q.get('tileType') || 'seamlessphoto',
        autoTexZoom: q.get('autoZoom') !== '0',
        pinLabel: q.get('pinLabel') || '目的地',
        annoSource: q.get('anno') || 'none'
      });

      // 任意の注記: ?labels=名前,緯度,経度|名前,緯度,経度
      const extraLabels = (q.get('labels') || '')
        .split('|').map(s => s.split(','))
        .filter(a => a.length === 3)
        .map(([text, lat, lon]) => ({ text, lat: parseFloat(lat), lon: parseFloat(lon) }));
      if (extraLabels.length) {
        const add = () => terrainElem.components['gsi-terrain'].addAnnotations(extraLabels);
        if (terrainElem.hasLoaded) add(); else terrainElem.addEventListener('loaded', add);
      }

      const depthElem = document.querySelector('#depth');
      const waterElem = document.querySelector('#water');
      depthElem.addEventListener('input', (e) => {
        const value = e.target.value;
        waterElem.object3D.position.y = value / 2;
        waterElem.object3D.scale.y = value;
      });
    </script>
  </body>
</html>
