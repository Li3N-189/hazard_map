<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title>GSI 3D Terrain Setup</title>
    <style>
      /* 設定UIフォームのスタイル */
      #params-ui {
        position: fixed;
        top: 10px;
        left: 10px;
        z-index: 10;
        background: rgba(255, 255, 255, 0.85);
        padding: 10px;
        border-radius: 8px;
        font-family: sans-serif;
        font-size: 3vh;
        box-shadow: 0 2px 6px rgba(0,0,0,0.3);
      }
      #params-ui input, #params-ui select, #params-ui button {
        margin: 2px 0 6px 0;
        width: 100%;
        box-sizing: border-box;
        font-size: 3vh;
        padding: 1.5vh;
      }
    </style>
  </head>
  <body style="margin: 0; overflow: hidden;">
    <!-- 左上: 緯度経度指定フォーム -->
    <div id="params-ui">
      <form id="location-form">
        <label>緯度 (Lat):
          <input type="number" id="lat-input" step="any" required>
        </label>
        <label>経度 (Lon):
          <input type="number" id="lon-input" step="any" required>
        </label>
        <label>ズーム (9-14):
          <input type="number" id="zoom-input" min="9" max="14" step="1" required>
        </label>
        <label>高さ強調:
          <input type="number" id="scale-input" min="0.1" max="10" step="0.1" value="1.0">
        </label>
        <button type="submit">表示更新</button>
      </form>
    </div>
    <script>
      function positionReceived(position) {
        document.getElementById('lat-input').value = position.coords.latitude;
        document.getElementById('lon-input').value = position.coords.longitude;
      }
      function positionError() {
        alert('位置情報の取得に失敗しました');
      }
      if (navigator.geolocation) {
        navigator.geolocation.getCurrentPosition(positionReceived, positionError);
      }
      
      // URLパラメータの取得
      const urlParams = new URLSearchParams(window.location.search);
      const lat = parseFloat(urlParams.get('lat')) || 35.3606;      // デフォルト: 富士山
      const lon = parseFloat(urlParams.get('lon')) || 138.7274;
      const zoom = parseInt(urlParams.get('zoom')) || 12;            // 国土地理院標高タイルの推奨ズーム (9-14)
      const heightScale = parseFloat(urlParams.get('heightScale')) || 1.0;

      // フォームの初期値をセット
      document.getElementById('lat-input').value = lat;
      document.getElementById('lon-input').value = lon;
      document.getElementById('zoom-input').value = zoom;
      document.getElementById('scale-input').value = heightScale;

      // UIフォームからの更新処理 (URLを更新して読み直し)
      document.getElementById('location-form').addEventListener('submit', (e) => {
        e.preventDefault();
        const newLat = document.getElementById('lat-input').value;
        const newLon = document.getElementById('lon-input').value;
        const newZoom = document.getElementById('zoom-input').value;
        const newScale = document.getElementById('scale-input').value;

        const params = new URLSearchParams(window.location.search);
        params.set('lat', newLat);
        params.set('lon', newLon);
        params.set('zoom', newZoom);
        params.set('heightScale', newScale);

        window.location.href = `auto_dl.html?${params.toString()}`;
      });
    </script>
  </body>
</html>
